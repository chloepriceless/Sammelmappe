<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2c5fd9">
  <title>Sammelmappe — Einrichtung</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-card">
    <h1>Erste Einrichtung</h1>
    <p>Lege ein Passwort fest, mit dem du dich künftig anmeldest.</p>
    <form class="auth-form" id="setup-form">
      <input type="password" name="password" placeholder="Passwort (min. 10 Zeichen)" autocomplete="new-password" required minlength="10" autofocus>
      <input type="password" name="password_confirm" placeholder="Passwort bestätigen" autocomplete="new-password" required minlength="10">
      <button type="submit">Loslegen</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script src="/static/setup.js"></script>
</body>
</html>
